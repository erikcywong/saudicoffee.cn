<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPELL.BIO — Financial Model</title>
<meta name="description" content="Unit economics proven in China, projected onto Saudi demand: 73.5% gross margin and sovereign-scale returns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
  <div class="container">

    <section class="hero">
      <h1 data-i18n="fin.hero.title"></h1>
      <p class="sub" data-i18n="fin.hero.sub"></p>
    </section>

    <!-- UNIT ECONOMICS -->
    <section class="section">
      <div class="section-head">
        <span class="kicker" data-i18n="fin.unit.kicker"></span>
        <h2 data-i18n="fin.unit.title"></h2>
      </div>
      <div class="grid grid-3">
        <div class="metric" data-i18n-title="u1.t"><div class="value">¥2.82M</div><div class="label" data-i18n="u1.l"></div></div>
        <div class="metric" data-i18n-title="u2.t"><div class="value">¥6.61</div><div class="label" data-i18n="u2.l"></div></div>
        <div class="metric" data-i18n-title="u3.t"><div class="value">¥25</div><div class="label" data-i18n="u3.l"></div></div>
        <div class="metric" data-i18n-title="u4.t"><div class="value green">73.5%</div><div class="label" data-i18n="u4.l"></div><div class="stat-row"><div class="stat-bar"><span class="green" style="width:73.5%"></span></div></div></div>
        <div class="metric" data-i18n-title="u5.t"><div class="value">¥15.4M</div><div class="label" data-i18n="u5.l"></div></div>
        <div class="metric" data-i18n-title="u6.t"><div class="value amber">&lt; 12<span style="font-size:.45em">mo</span></div><div class="label" data-i18n="u6.l"></div></div>
      </div>
    </section>

    <!-- PROJECTIONS -->
    <section class="section" id="proj">
      <div class="section-head">
        <span class="kicker" data-i18n="fin.proj.kicker"></span>
        <h2 data-i18n="fin.proj.title"></h2>
        <p data-i18n="fin.proj.p"></p>
      </div>
      <div class="grid grid-4">
        <div class="metric" data-i18n-title="p1.t"><div class="value">$86-139M</div><div class="label" data-i18n="p1.l"></div><div class="note" data-i18n="fin.y5"></div></div>
        <div class="metric" data-i18n-title="p2.t"><div class="value">5-8%</div><div class="label" data-i18n="p2.l"></div><div class="note" data-i18n="fin.y7"></div></div>
        <div class="metric" data-i18n-title="p3.t"><div class="value">15%</div><div class="label" data-i18n="p3.l"></div><div class="note" data-i18n="fin.y10"></div></div>
        <div class="metric" data-i18n-title="p4.t"><div class="value green">73.5%+</div><div class="label" data-i18n="p4.l"></div><div class="note" data-i18n="fin.p4n"></div></div>
      </div>
    </section>

    <!-- RISK -->
    <section class="section">
      <div class="section-head">
        <span class="kicker" data-i18n="fin.risk.kicker"></span>
        <h2 data-i18n="fin.risk.title"></h2>
      </div>
      <div class="grid grid-3">
        <div class="card"><ul class="check"><li data-i18n="fr1"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="fr2"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="fr3"></li></ul></div>
      </div>
      <div class="note-box" data-i18n="ft.priv"></div>
    </section>

  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
