<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPELL.BIO — Partnership Proposal</title>
<meta name="description" content="A staged joint venture with PIF / Saudi Coffee Company: $10-15M pilot to a $200-250M full coffee value chain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
  <div class="container">

    <section class="hero">
      <h1 data-i18n="part.hero.title"></h1>
      <p class="sub" data-i18n="part.hero.sub"></p>
    </section>

    <!-- STAGE 1: PILOT JV -->
    <section class="section" id="pilot">
      <div class="section-head">
        <span class="kicker" data-i18n="part.pilot.kicker"></span>
        <h2 data-i18n="part.pilot.title"></h2>
        <p data-i18n="part.pilot.p"></p>
      </div>
      <div class="grid grid-3">
        <div class="metric"><div class="value">$10-15M</div><div class="label" data-i18n="part.v1"></div><div class="note" data-i18n="part.v1n"></div></div>
        <div class="metric"><div class="value">30-40%</div><div class="label" data-i18n="part.v2"></div><div class="note" data-i18n="part.v2n"></div></div>
        <div class="metric"><div class="value">60-70%</div><div class="label" data-i18n="part.v3"></div><div class="note" data-i18n="part.v3n"></div></div>
      </div>
      <div class="two-col" style="margin-top:16px">
        <div class="card">
          <h3 data-i18n="pn.t"></h3>
          <ul class="check">
            <li data-i18n="pn1"></li>
            <li data-i18n="pn2"></li>
            <li data-i18n="pn3"></li>
          </ul>
        </div>
        <div class="card">
          <h3 data-i18n="ps.t"></h3>
          <ul class="check">
            <li data-i18n="ps1"></li>
            <li data-i18n="ps2"></li>
            <li data-i18n="ps3"></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- STAGE 2: FULL CHAIN -->
    <section class="section">
      <div class="section-head">
        <span class="kicker" data-i18n="part.full.kicker"></span>
        <h2 data-i18n="part.full.title"></h2>
        <p data-i18n="part.full.p"></p>
      </div>
      <div class="chain">
        <div class="chain-node"><div class="num">01</div><h4 data-i18n="f1.t"></h4><p data-i18n="f1.d"></p></div>
        <span class="chain-arrow">→</span>
        <div class="chain-node"><div class="num">02</div><h4 data-i18n="f2.t"></h4><p data-i18n="f2.d"></p></div>
        <span class="chain-arrow">→</span>
        <div class="chain-node"><div class="num">03</div><h4 data-i18n="f3.t"></h4><p data-i18n="f3.d"></p></div>
        <span class="chain-arrow">→</span>
        <div class="chain-node"><div class="num">04</div><h4 data-i18n="f4.t"></h4><p data-i18n="f4.d"></p></div>
        <span class="chain-arrow">→</span>
        <div class="chain-node"><div class="num">05</div><h4 data-i18n="f5.t"></h4><p data-i18n="f5.d"></p></div>
        <span class="chain-arrow">→</span>
        <div class="chain-node"><div class="num">06</div><h4 data-i18n="f6.t"></h4><p data-i18n="f6.d"></p></div>
      </div>
    </section>

    <!-- GOVERNANCE & IP -->
    <section class="section" id="gov">
      <div class="section-head">
        <span class="kicker" data-i18n="part.ip.kicker"></span>
        <h2 data-i18n="part.ip.title"></h2>
      </div>
      <div class="card"><p data-i18n="part.ip.p"></p></div>

      <div class="section-head" style="margin-top:38px">
        <span class="kicker" data-i18n="part.local.kicker"></span>
        <h2 data-i18n="part.local.title"></h2>
      </div>
      <div class="grid grid-3">
        <div class="card"><ul class="check"><li data-i18n="lb1"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="lb2"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="lb3"></li></ul></div>
      </div>
    </section>

    <!-- NEGOTIATION FRAMEWORK -->
    <section class="section">
      <div class="section-head">
        <span class="kicker" data-i18n="part.red.kicker"></span>
        <h2 data-i18n="part.red.title"></h2>
      </div>
      <div class="card">
        <ul class="check">
          <li data-i18n="rr1"></li>
          <li data-i18n="rr2"></li>
          <li data-i18n="rr3"></li>
        </ul>
      </div>
    </section>

  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
