<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPELL.BIO — Technology</title>
<meta name="description" content="AI-driven coffee tissue culture and aeroponic cultivation — built specifically for coffee.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
  <div class="container">

    <section class="hero">
      <h1 data-i18n="tech.hero.title"></h1>
      <p class="sub" data-i18n="tech.hero.sub"></p>
    </section>

    <!-- SYSTEM 01 -->
    <section class="section" id="tissue">
      <div class="section-head">
        <span class="kicker" data-i18n="tech.tissue.kicker"></span>
        <h2 data-i18n="tech.tissue.title"></h2>
      </div>
      <div class="two-col">
        <div class="card"><p data-i18n="tech.tissue.p1"></p></div>
        <div class="card">
          <p data-i18n="tech.tissue.p2"></p>
          <ul class="check">
            <li data-i18n="tb1"></li>
            <li data-i18n="tb2"></li>
            <li data-i18n="tb3"></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- SYSTEM 02 -->
    <section class="section" id="aero">
      <div class="section-head">
        <span class="kicker" data-i18n="tech.aero.kicker"></span>
        <h2 data-i18n="tech.aero.title"></h2>
      </div>
      <div class="two-col">
        <div class="card">
          <p data-i18n="tech.aero.p1"></p>
          <ul class="check">
            <li data-i18n="ab1"></li>
            <li data-i18n="ab2"></li>
            <li data-i18n="ab3"></li>
          </ul>
        </div>
        <div class="card"><p data-i18n="tech.aero.p2"></p></div>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section class="section" id="dash">
      <div class="section-head">
        <span class="kicker" data-i18n="metrics.kicker"></span>
        <h2 data-i18n="metrics.title"></h2>
      </div>
      <div class="grid grid-3">
        <div class="metric" data-i18n-title="m1.t"><div class="value">615K</div><div class="label" data-i18n="m1.l"></div><div class="note" data-i18n="note.m1"></div></div>
        <div class="metric" data-i18n-title="m2.t"><div class="value green">90%</div><div class="label" data-i18n="m2.l"></div><div class="stat-row"><div class="stat-bar"><span class="green" style="width:10%"></span></div></div></div>
        <div class="metric" data-i18n-title="m3.t"><div class="value">12-14<span style="font-size:.45em">mo</span></div><div class="label" data-i18n="m3.l"></div><div class="note" data-i18n="note.m3s"></div></div>
        <div class="metric" data-i18n-title="m4.t"><div class="value">15×</div><div class="label" data-i18n="m4.l"></div></div>
        <div class="metric" data-i18n-title="m5.t"><div class="value green">73.5%</div><div class="label" data-i18n="m5.l"></div></div>
        <div class="metric"><div class="value">81</div><div class="label" data-i18n="tech.sys"></div><div class="note" data-i18n="tech.sysn"></div></div>
      </div>
    </section>

    <!-- COMPARISON -->
    <section class="section">
      <div class="section-head"><h2 data-i18n="cmp.title"></h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th data-i18n="th.param"></th><th data-i18n="th.trad"></th><th data-i18n="th.napell"></th></tr></thead>
          <tbody>
            <tr><td data-i18n="r1.p"></td><td class="lose" data-i18n="r1.a"></td><td class="win" data-i18n="r1.b"></td></tr>
            <tr><td data-i18n="r2.p"></td><td class="lose" data-i18n="r2.a"></td><td class="win" data-i18n="r2.b"></td></tr>
            <tr><td data-i18n="r3.p"></td><td class="lose" data-i18n="r3.a"></td><td class="win" data-i18n="r3.b"></td></tr>
            <tr><td data-i18n="r4.p"></td><td class="lose" data-i18n="r4.a"></td><td class="win" data-i18n="r4.b"></td></tr>
            <tr><td data-i18n="r5.p"></td><td class="lose" data-i18n="r5.a"></td><td class="win" data-i18n="r5.b"></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- PATENT -->
    <section class="section">
      <div class="section-head">
        <span class="kicker" data-i18n="tech.patent.kicker"></span>
        <h2 data-i18n="tech.patent.title"></h2>
      </div>
      <div class="card">
        <span class="pill blue">CN 202611094298.6</span><span class="pill" data-i18n="pill.pct"></span>
        <p style="margin-top:14px" data-i18n="tech.patent.p"></p>
      </div>
    </section>

    <!-- PoC OFFER -->
    <section class="section">
      <div class="card accent" style="text-align:center;padding:44px 32px">
        <span class="kicker" style="display:block;margin-bottom:8px" data-i18n="tech.poc.kicker"></span>
        <h3 style="font-size:clamp(22px,3vw,30px)" data-i18n="tech.poc.title"></h3>
        <p style="max-width:660px;margin:14px auto 24px" data-i18n="tech.poc.p"></p>
        <a class="btn btn-primary" href="contact.html" data-i18n="tech.poc.btn"></a>
      </div>
    </section>

  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/app.js"></script>

</html>
