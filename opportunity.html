<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPELL.BIO — The Saudi Coffee Opportunity</title>
<meta name="description" content="Saudi Arabia's coffee market gap: 1,485 tonnes produced vs a 7,000-tonne national target — and the seedling bottleneck.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<div class="page">

    <section class="hero">

        <span class="kicker" data-i18n="opp.stats.kicker"></span>

      </div>
      <div class="grid grid-4">
        <div class="metric" data-i18n-title="s1.t"><div class="value">1,485<span style="font-size:.4em">t</span></div><div class="label" data-i18n="s1.l"></div></div>
        <div class="metric" data-i18n-title="s2.t"><div class="value">7,000<span style="font-size:.4em">t</span></div><div class="label" data-i18n="s2.l"></div></div>
        <div class="metric" data-i18n-title="s3.t"><div class="value amber">96%</div><div class="label" data-i18n="s3.l"></div></div>
        <div class="metric" data-i18n-title="s4.t"><div class="value">3-5M</div><div class="label" data-i18n="s4.l"></div></div>

        <div class="metric" data-i18n-title="s6.t"><div class="value">2,500</div><div class="label" data-i18n="s6.l"></div></div>
        <div class="metric" data-i18n-title="s7.t"><div class="value">$1.2B+</div><div class="label" data-i18n="s7.l"></div></div>
        <div class="metric" data-i18n-title="s8.t"><div class="value">30,000<span style="font-size:.4em">m²</span></div><div class="label" data-i18n="s8.l"></div></div>
      </div>
    </section>

    <!-- GAP -->
    <section class="section" id="gap">
      <div class="section-head">
        <span class="kicker" data-i18n="opp.gap.kicker"></span>
        <h2 data-i18n="opp.gap.title"></h2>
      </div>
      <div class="two-col">
        <div class="card"><p data-i18n="opp.gap.p1"></p></div>
        <div class="card accent"><p data-i18n="opp.gap.p2"></p></div>
      </div>
    </section>

    <!-- COMPARISON TABLE -->
    <section class="section">
      <div class="section-head">
        <h2 data-i18n="cmp.title"></h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th data-i18n="th.param"></th><th data-i18n="th.trad"></th><th data-i18n="th.napell"></th></tr>
          </thead>
          <tbody>
            <tr><td data-i18n="r1.p"></td><td class="lose" data-i18n="r1.a"></td><td class="win" data-i18n="r1.b"></td></tr>

    <section class="section">
      <div class="section-head">
        <span class="kicker" data-i18n="opp.scc.kicker"></span>
        <h2 data-i18n="opp.scc.title"></h2>
