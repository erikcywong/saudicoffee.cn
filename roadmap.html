<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPELL.BIO — Roadmap</title>
<meta name="description" content="Five phases from first contact to a sovereign Saudi coffee industry — each gated by verified data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
  <div class="container">

    <section class="hero">
      <h1 data-i18n="rm.hero.title"></h1>
      <p class="sub" data-i18n="rm.hero.sub"></p>
    </section>

    <!-- TIMELINE -->
    <section class="section">
      <div class="timeline">
        <div class="tl-item">
          <div class="tl-dot">0</div>
          <span class="time" data-i18n="ph0.time"></span>
          <h3 data-i18n="ph0.t"></h3>
          <p data-i18n="ph0.d"></p>
        </div>
        <div class="tl-item">
          <div class="tl-dot">1</div>
          <span class="time" data-i18n="ph1.time"></span>
          <h3 data-i18n="ph1.t"></h3>
          <p data-i18n="ph1.d"></p>
        </div>
        <div class="tl-item">
          <div class="tl-dot">2</div>
          <span class="time" data-i18n="ph2.time"></span>
          <h3 data-i18n="ph2.t"></h3>
          <p data-i18n="ph2.d"></p>
        </div>
        <div class="tl-item">
          <div class="tl-dot">3</div>
          <span class="time" data-i18n="ph3.time"></span>
          <h3 data-i18n="ph3.t"></h3>
          <p data-i18n="ph3.d"></p>
        </div>
        <div class="tl-item">
          <div class="tl-dot">4</div>
          <span class="time" data-i18n="ph4.time"></span>
          <h3 data-i18n="ph4.t"></h3>
          <p data-i18n="ph4.d"></p>
        </div>
      </div>
    </section>

    <!-- MILESTONES -->
    <section class="section" id="milestones">
      <div class="section-head">
        <span class="kicker" data-i18n="rm.ms.kicker"></span>
        <h2 data-i18n="rm.ms.title"></h2>
      </div>
      <div class="grid grid-3">
        <div class="card"><ul class="check"><li data-i18n="ms1"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="ms2"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="ms3"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="ms4"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="ms5"></li></ul></div>
        <div class="card"><ul class="check"><li data-i18n="ms6"></li></ul></div>
      </div>
    </section>

  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
