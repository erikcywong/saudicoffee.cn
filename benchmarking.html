<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPELL.BIO — Benchmarking & Comparable Analysis</title>
<meta name="description" content="No exact peer exists — but three layers of our model are validated: aeroponics, premium indoor fruit, and coffee supply-chain reinvention. Verified as of September 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
  <div class="container">

    <!-- HERO -->
    <section class="hero">
      <h1 data-i18n="bm.hero.title"></h1>
      <p class="sub" data-i18n="bm.hero.sub"></p>
    </section>

    <!-- VERDICT -->
    <section class="section" id="verdict">
      <div class="section-head">
        <span class="kicker" data-i18n="bm.v.kicker"></span>
        <h2 data-i18n="bm.v.title"></h2>
      </div>
      <p data-i18n="bm.v.p1" style="color:var(--muted);max-width:860px;margin-bottom:14px"></p>
      <p data-i18n="bm.v.p2" style="color:var(--text);font-weight:600;margin-bottom:18px"></p>
      <div class="grid grid-3">
        <div class="card">
          <h3 data-i18n="bm.v.l1t"></h3>
          <p data-i18n="bm.v.l1d"></p>
        </div>
        <div class="card">
          <h3 data-i18n="bm.v.l2t"></h3>
          <p data-i18n="bm.v.l2d"></p>
        </div>
        <div class="card">
          <h3 data-i18n="bm.v.l3t"></h3>
          <p data-i18n="bm.v.l3d"></p>
        </div>
      </div>
      <div class="card accent" style="margin-top:16px">
        <p style="color:var(--text);font-weight:600" data-i18n="bm.v.close"></p>
      </div>
    </section>

    <!-- REALITY CHECK -->
    <section class="section" id="shakeout">
      <div class="section-head">
        <span class="kicker" data-i18n="bm.sh.kicker"></span>
        <h2 data-i18n="bm.sh.title"></h2>
        <p data-i18n="bm.sh.sub"></p>
      </div>
      <div class="grid grid-3">
        <div class="metric">
          <span class="icon">📉</span>
          <div class="value" data-i18n="bm.sh.s1v"></div>
          <div class="label" data-i18n="bm.sh.s1l"></div>
        </div>
        <div class="metric">
          <span class="icon">💸</span>
          <div class="value amber" data-i18n="bm.sh.s2v"></div>
          <div class="label" data-i18n="bm.sh.s2l"></div>
        </div>
        <div class="metric">
          <span class="icon">🎯</span>
          <div class="value" data-i18n="bm.sh.s3v"></div>
          <div class="label" data-i18n="bm.sh.s3l"></div>
        </div>
      </div>

      <div class="grid" style="margin-top:18px">
        <div class="card">
          <h3>AeroFarms <span class="pill blue" data-i18n="bm.st.acq"></span></h3>
          <p style="color:var(--text);font-weight:600;margin-bottom:6px" data-i18n="bm.sh.aero.s"></p>
          <p data-i18n="bm.sh.aero.l"></p>
        </div>
        <div class="card">
          <h3>Plenty <span class="pill blue" data-i18n="bm.st.ch11"></span></h3>
          <p style="color:var(--text);font-weight:600;margin-bottom:6px" data-i18n="bm.sh.plenty.s"></p>
          <p data-i18n="bm.sh.plenty.l"></p>
        </div>
        <div class="card">
          <h3>Bowery Farming <span class="pill blue" data-i18n="bm.st.dead"></span></h3>
          <p style="color:var(--text);font-weight:600;margin-bottom:6px" data-i18n="bm.sh.bowery.s"></p>
          <p data-i18n="bm.sh.bowery.l"></p>
        </div>
        <div class="card">
          <h3>80 Acres Farms <span class="pill blue" data-i18n="bm.st.ch7"></span></h3>
          <p style="color:var(--text);font-weight:600;margin-bottom:6px" data-i18n="bm.sh.acres.s"></p>
          <p data-i18n="bm.sh.acres.l"></p>
        </div>
        <div class="card">
          <h3>Freight Farms <span class="pill blue" data-i18n="bm.st.ch7"></span></h3>
          <p style="color:var(--text);font-weight:600;margin-bottom:6px" data-i18n="bm.sh.freight.s"></p>
          <p data-i18n="bm.sh.freight.l"></p>
        </div>
      </div>

      <div class="card accent" style="margin-top:18px">
        <h3 data-i18n="bm.sh.in.t"></h3>
        <p style="color:var(--text)" data-i18n="bm.sh.in.p"></p>
      </div>

      <div class="grid grid-4" style="margin-top:16px">
        <div class="card"><h3 data-i18n="bm.sh.t1"></h3><p data-i18n="bm.sh.d1"></p></div>
        <div class="card"><h3 data-i18n="bm.sh.t2"></h3><p data-i18n="bm.sh.d2"></p></div>
        <div class="card"><h3 data-i18n="bm.sh.t3"></h3><p data-i18n="bm.sh.d3"></p></div>
        <div class="card"><h3 data-i18n="bm.sh.t4"></h3><p data-i18n="bm.sh.d4"></p></div>
      </div>
    </section>

    <!-- PEER MAP -->
    <section class="section" id="peers">
      <div class="section-head">
        <span class="kicker" data-i18n="bm.ly.kicker"></span>
        <h2 data-i18n="bm.ly.title"></h2>
        <p data-i18n="bm.ly.sub"></p>
      </div>
      <div class="grid grid-3">
        <div class="card">
          <h3>Oishii</h3>
          <p style="color:var(--accent);font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px" data-i18n="bm.ly.o.role"></p>
          <p data-i18n="bm.ly.o.b1"></p>
          <p data-i18n="bm.ly.o.b2"></p>
          <p data-i18n="bm.ly.o.b3"></p>
          <p style="margin-top:12px;color:var(--accent);font-weight:700" data-i18n="bm.ly.o.why"></p>
        </div>
        <div class="card">
          <h3>AeroFarms</h3>
          <p style="color:var(--accent);font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px" data-i18n="bm.ly.a.role"></p>
          <p data-i18n="bm.ly.a.b1"></p>
          <p data-i18n="bm.ly.a.b2"></p>
          <p data-i18n="bm.ly.a.b3"></p>
          <p style="margin-top:12px;color:var(--accent);font-weight:700" data-i18n="bm.ly.a.why"></p>
        </div>
        <div class="card">
          <h3>Atomo Coffee</h3>
          <p style="color:var(--accent);font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px" data-i18n="bm.ly.at.role"></p>
          <p data-i18n="bm.ly.at.b1"></p>
          <p data-i18n="bm.ly.at.b2"></p>
          <p data-i18n="bm.ly.at.b3"></p>
          <p style="margin-top:12px;color:var(--accent);font-weight:700" data-i18n="bm.ly.at.why"></p>
        </div>
      </div>

      <span class="kicker" data-i18n="bm.t.kicker" style="display:block;margin:36px 0 14px"></span>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="bm.t.h1"></th>
              <th data-i18n="bm.t.h2"></th>
              <th data-i18n="bm.t.h3"></th>
              <th data-i18n="bm.t.h4"></th>
              <th data-i18n="bm.t.h5"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="hero-val">Oishii</td>
              <td data-i18n="bm.t.r1.c2"></td>
              <td data-i18n="bm.t.r1.c3"></td>
              <td data-i18n="bm.t.r1.c4"></td>
              <td class="win" data-i18n="bm.t.r1.c5"></td>
            </tr>
            <tr>
              <td class="hero-val">AeroFarms</td>
              <td data-i18n="bm.t.r2.c2"></td>
              <td data-i18n="bm.t.r2.c3"></td>
              <td data-i18n="bm.t.r2.c4"></td>
              <td class="win" data-i18n="bm.t.r2.c5"></td>
            </tr>
            <tr>
              <td class="hero-val">Atomo Coffee</td>
              <td data-i18n="bm.t.r3.c2"></td>
              <td data-i18n="bm.t.r3.c3"></td>
              <td data-i18n="bm.t.r3.c4"></td>
              <td class="win" data-i18n="bm.t.r3.c5"></td>
            </tr>
            <tr>
              <td class="hero-val">Compound Foods</td>
              <td data-i18n="bm.t.r4.c2"></td>
              <td data-i18n="bm.t.r4.c3"></td>
              <td data-i18n="bm.t.r4.c4"></td>
              <td class="win" data-i18n="bm.t.r4.c5"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- WHY THE GAP -->
    <section class="section" id="gap">
      <div class="section-head">
        <span class="kicker" data-i18n="bm.wh.kicker"></span>
        <h2 data-i18n="bm.wh.title"></h2>
        <p data-i18n="bm.wh.sub"></p>
      </div>
      <div class="grid grid-3" style="margin-bottom:18px">
        <div class="metric">
          <div class="value" data-i18n="bm.wh.c1.v"></div>
          <div class="label" data-i18n="bm.wh.c1.l"></div>
        </div>
        <div class="metric">
          <div class="value amber" data-i18n="bm.wh.c2.v"></div>
          <div class="label" data-i18n="bm.wh.c2.l"></div>
        </div>
        <div class="metric">
          <div class="value" data-i18n="bm.wh.c3.v"></div>
          <div class="label" data-i18n="bm.wh.c3.l"></div>
        </div>
      </div>
      <div class="grid">
        <div class="card"><h3 data-i18n="bm.wh.r1.t"></h3><p data-i18n="bm.wh.r1.d"></p></div>
        <div class="card"><h3 data-i18n="bm.wh.r2.t"></h3><p data-i18n="bm.wh.r2.d"></p></div>
        <div class="card"><h3 data-i18n="bm.wh.r3.t"></h3><p data-i18n="bm.wh.r3.d"></p></div>
        <div class="card"><h3 data-i18n="bm.wh.r4.t"></h3><p data-i18n="bm.wh.r4.d"></p></div>
      </div>
      <div class="card accent" style="margin-top:16px">
        <p style="color:var(--text);font-weight:600" data-i18n="bm.wh.turn.p"></p>
      </div>
    </section>

    <!-- CLOSE -->
    <section class="section">
      <div class="card accent">
        <p style="color:var(--text);font-size:20px;font-weight:700;line-height:1.6" data-i18n="bm.close.p1"></p>
        <p style="color:var(--accent);font-size:20px;font-weight:800;line-height:1.6;margin-top:10px" data-i18n="bm.close.p2"></p>
      </div>
      <div class="note-box" data-i18n="bm.note.src"></div>
    </section>

  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
